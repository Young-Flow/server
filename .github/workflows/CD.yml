name: CD

on:
  push:
    branches: [ "dev" ]
    
env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: pitchain-server-s3-bucket
  CODE_DEPLOY_APPLICATION_NAME: pitchain-codedeploy-app
  CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: pitchain-codedeploy-deployment-group

permissions:
  id-token: write
  contents: read

jobs:
  CD:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Gradle Caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Copy application-prod.yml
      env:
        YML: ${{ secrets.APPLICATION_PROD_YML }}
        YML_DIR: src/main/resources
        YML_NAME: application-prod.yml
      run: |
        mkdir -p $YML_DIR
        echo -n "$YML" | base64 --decode > $YML_DIR/$YML_NAME

    - name: Copy application-test.yml
      env:
        YML: ${{ secrets.APPLICATION_TEST_YML }}
        YML_DIR: src/test/resources
        YML_NAME: application-test.yml
      run: |
        mkdir -p $YML_DIR
        echo -n "$YML" | base64 --decode > $YML_DIR/$YML_NAME    

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle, without test
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      run: ./gradlew clean build -x test
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::440744244245:role/pitchain-github-actions-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Upload to AWS S3
      run: |
        aws deploy push \
          --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
          --ignore-hidden-files \
          --s3-location s3://$S3_BUCKET_NAME/$GITHUB_SHA.zip \
          --source .

    - name: Deploy to AWS EC2 from S3
      run: |
        aws deploy create-deployment \
          --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
          --deployment-config-name CodeDeployDefault.AllAtOnce \
          --deployment-group-name ${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
          --s3-location bucket=$S3_BUCKET_NAME,key=$GITHUB_SHA.zip,bundleType=zip

