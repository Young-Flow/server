name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [dev]
    paths:
      - '**'

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Start Redis
      uses: supercharge/redis-github-action@1.7.0
      with:
        redis-version: 6
        redis-port: 6379

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Gradle Caching
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Copy application-prod.yml
      env:
        YML: ${{ secrets.APPLICATION_PROD_YML }}
        YML_DIR: src/main/resources
        YML_NAME: application-prod.yml
      run: |
        mkdir -p $YML_DIR
        echo -n "$YML" | base64 --decode > $YML_DIR/$YML_NAME

    - name: Copy application-test.yml
      env:
        YML: ${{ secrets.APPLICATION_TEST_YML }}
        YML_DIR: src/test/resources
        YML_NAME: application-test.yml
      run: |
        mkdir -p $YML_DIR
        echo -n "$YML" | base64 --decode > $YML_DIR/$YML_NAME

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      run: ./gradlew clean build
