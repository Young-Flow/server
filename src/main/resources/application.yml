spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: pitchain
    server: http://localhost:8080
  messages:
    basename: messages/messages-error
    fallback-to-system-locale: false
    encoding: UTF-8
    cache-duration: 3600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  datasource:
    master:
      driver-class-name: ${MASTER_DATASOURCE_DRIVER_CLASS_NAME}
      jdbc-url: ${MASTER_DATASOURCE_URL}
      username: ${MASTER_DATABASE_USERNAME}
      password: ${MASTER_DATABASE_PASSWORD}
    replica:
      driver-class-name: ${REPLICA_DATASOURCE_DRIVER_CLASS_NAME}
      jdbc-url: ${REPLICA_DATASOURCE_URL}
      username: ${REPLICA_DATABASE_USERNAME}
      password: ${REPLICA_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
      show-sql: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    channel: ${REDIS_CHANNEL}
  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET_NAME}
      cdn: ${AWS_CDN_URL}
      stack:
        auto: false
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
    header: ${JWT_ACCESS_HEADER}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}
    header: ${JWT_REFRESH_HEADER}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

logging:
  level:
    root: info
  org:
    hibernate:
      SQL: info
    springframework:
      web:
        cors:
          DefaultCorsProcessor: trace
        client:
          RestTemplate: debug

oauth:
  kakao:
    token_url: "https://kauth.kakao.com/oauth/token"
    user_url: "https://kapi.kakao.com/v2/user/me"
    grant_type: authorization_code
    client_id: ${KAKAO_CLIENT_ID}
    client_secret: ${KAKAO_CLIENT_SECRET}
    redirect_uri: ${KAKAO_REDIRECT_URI}
  google:
    token_url: "https://oauth2.googleapis.com/token"
    user_url: "https://www.googleapis.com/oauth2/v3/userinfo"
    grant_type: authorization_code
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_uri: ${GOOGLE_REDIRECT_URI}
  naver:
    token_url: "https://nid.naver.com/oauth2.0/token"
    user_url: "https://openapi.naver.com/v1/nid/me"
    grant_type: authorization_code
    client_id: ${NAVER_CLIENT_ID}
    client_secret: ${NAVER_CLIENT_SECRET}
    redirect_uri: ${NAVER_REDIRECT_URI}
